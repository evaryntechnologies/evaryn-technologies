name: Deliver employee notification emails
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Dispatch verified notification sender
        env:
          DELIVERY_URL: ${{ secrets.EVARYN_NOTIFICATION_DELIVERY_URL }}
          DELIVERY_SECRET: ${{ secrets.EVARYN_NOTIFICATION_DELIVERY_SECRET }}
        run: |
          test -n "$DELIVERY_URL" && test -n "$DELIVERY_SECRET" || { echo "Notification delivery secrets are not configured"; exit 1; }
          curl --fail --show-error --silent --max-time 120 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer $DELIVERY_SECRET" "$DELIVERY_URL"

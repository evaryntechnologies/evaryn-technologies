name: Deliver client notification emails
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Deliver client notifications
        env:
          DELIVERY_SECRET: ${{ secrets.EVARYN_NOTIFICATION_DELIVERY_SECRET }}
        run: |
          test -n "$DELIVERY_SECRET" || { echo "Delivery secret is missing"; exit 1; }
          curl --fail-with-body --show-error --silent --max-time 120 \
            -X POST -H "Authorization: Bearer $DELIVERY_SECRET" \
            'https://www.evaryninc.com/api/internal/client-notification-emails'
